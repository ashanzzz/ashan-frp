name: Test and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GOFLAGS: -mod=mod

jobs:
  test:
    name: Go test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frp-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: frp-backend/go.mod
          cache: true
          cache-dependency-path: frp-backend/go.mod

      - name: Download Go modules
        run: go mod download

      - name: Check repository hygiene
        working-directory: .
        run: |
          test -z "$(git ls-files 'userdata.txt' '.omo/**' 'outputs/**' '.playwright-cli/**')"

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run embedded UI tests
        run: node --test internal/web/app.test.mjs

      - name: Build backend binary
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" ./cmd/ashan-frp

  docker:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
