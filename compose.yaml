services:
  ashan-frp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ashanzzz/ashan-frp:latest
    container_name: ashan-frp
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATA_DIR: /app/data
      DATABASE_DSN: "file:/app/data/state.db"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
